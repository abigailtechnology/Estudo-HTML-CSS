<!DOCTYPE html>
<html lang="pt=br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="menu.css" type="text/css">

</head>

<body>
    <main id="container">
        <form id="login_form" method="post" action="#">
            <div id="form_header">
                <h1>Login</h1>
                <i id="mode_icon" class="fas fa-moon"></i>
            </div>
            <div class="inputs">
                <div class="input-box">
                    <label for="name">Nome
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="text" name="name">
                        </div>
                    </label>
                </div>
                <div class="input-box">
                    <label for="email">
                        E-mail
                        <div class="input-field">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email">
                        </div>
                    </label>
                </div>
                <div class="input-box">
                    <label for="password">Senha
                        <div class="input-field">
                            <i class="fas fa-lock"></i>
                            <input type="password" name="password">
                        </div>
                    </label>
                </div>
            </div>
            <div class="esqueceu_senha">
                <a href="#">Esqueceu sua senha?</a>
            </div>
            <button type="submit" id="login_bt"> Login</button>
            <div class="cadastro">
                <a href="#">Não tem cadastro? <span class="cad">Cadastra-se </span></a>
            </div>
            <div class="rodape">
                <div class="social_media">
                    <a href="#" title="Faça login com Facebook"> <i class="fab fa-facebook"></i> </a>
                    <a href="#" title="Faça login com Google"> <i class="fab fa-google"></i> </a>
                    <a href="#" title="Faça login com GitHub"> <i class="fab fa-github"></i> </a>
                </div>
            </div>
        </form>

    </main>
    </div>

    <!-- JAVA SCRIPT-->
    <script src="assets/js/script.js"></script>
</body>
</html>
